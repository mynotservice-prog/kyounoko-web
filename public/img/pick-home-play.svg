<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="雨の日、家で遊ぶ子どものイメージ">
  <defs>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE8D8"/>
      <stop offset="1" stop-color="#F4DDCF"/>
    </linearGradient>
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5E2EB"/>
      <stop offset="1" stop-color="#CFDAE3"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#EBC06A" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#EBC06A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- room background -->
  <rect width="600" height="400" fill="url(#interior)"/>

  <!-- floor (wood) -->
  <rect y="290" width="600" height="110" fill="#C9603E" opacity="0.18"/>
  <!-- floor planks -->
  <line x1="0" y1="320" x2="600" y2="320" stroke="#8E3F22" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#8E3F22" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#8E3F22" stroke-width="1" opacity="0.15"/>

  <!-- lamp light glow -->
  <ellipse cx="500" cy="180" rx="130" ry="200" fill="url(#lamp)"/>

  <!-- window on left -->
  <g transform="translate(40,50)">
    <!-- frame -->
    <rect x="0" y="0" width="170" height="200" fill="url(#windowSky)" stroke="#C9603E" stroke-width="5"/>
    <line x1="85" y1="0" x2="85" y2="200" stroke="#C9603E" stroke-width="4"/>
    <line x1="0" y1="100" x2="170" y2="100" stroke="#C9603E" stroke-width="4"/>
    <!-- rain drops -->
    <g stroke="#7FA3BA" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
      <line x1="15" y1="20" x2="10" y2="35"/>
      <line x1="40" y1="30" x2="35" y2="45"/>
      <line x1="65" y1="15" x2="60" y2="30"/>
      <line x1="20" y1="60" x2="15" y2="75"/>
      <line x1="55" y1="75" x2="50" y2="90"/>
      <line x1="25" y1="110" x2="20" y2="125"/>
      <line x1="55" y1="125" x2="50" y2="140"/>
      <line x1="70" y1="145" x2="65" y2="160"/>
      <line x1="15" y1="155" x2="10" y2="170"/>
      <line x1="40" y1="180" x2="35" y2="195"/>
      <line x1="105" y1="25" x2="100" y2="40"/>
      <line x1="135" y1="40" x2="130" y2="55"/>
      <line x1="115" y1="70" x2="110" y2="85"/>
      <line x1="150" y1="90" x2="145" y2="105"/>
      <line x1="110" y1="120" x2="105" y2="135"/>
      <line x1="140" y1="145" x2="135" y2="160"/>
      <line x1="115" y1="175" x2="110" y2="190"/>
    </g>
    <!-- distant blurred building -->
    <rect x="90" y="70" width="30" height="30" fill="#8FA37E" opacity="0.3"/>
    <rect x="130" y="60" width="20" height="40" fill="#8FA37E" opacity="0.3"/>
  </g>

  <!-- plant by window -->
  <g transform="translate(225,220)">
    <!-- pot -->
    <path d="M0 40 L5 70 L35 70 L40 40 Z" fill="#C9603E" opacity="0.7"/>
    <!-- leaves -->
    <ellipse cx="20" cy="30" rx="8" ry="18" fill="#8FA37E"/>
    <ellipse cx="10" cy="25" rx="6" ry="16" fill="#728670" transform="rotate(-20 10 25)"/>
    <ellipse cx="30" cy="22" rx="6" ry="14" fill="#728670" transform="rotate(20 30 22)"/>
    <ellipse cx="20" cy="10" rx="5" ry="12" fill="#8FA37E"/>
  </g>

  <!-- rug -->
  <ellipse cx="380" cy="330" rx="150" ry="30" fill="#F4B787" opacity="0.55"/>
  <!-- rug stripes -->
  <line x1="250" y1="325" x2="510" y2="325" stroke="#C9603E" stroke-width="1.5" opacity="0.3"/>
  <line x1="255" y1="335" x2="505" y2="335" stroke="#C9603E" stroke-width="1.5" opacity="0.3"/>

  <!-- toy blocks on rug -->
  <g transform="translate(320,295)">
    <!-- block 1 (tall, peach) -->
    <rect x="0" y="0" width="28" height="28" fill="#F4B787" stroke="#C9603E" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Zen Maru Gothic', sans-serif" font-size="18" fill="#C9603E" text-anchor="middle" font-weight="700">A</text>
    <!-- block 2 (honey, on top) -->
    <rect x="2" y="-30" width="24" height="28" fill="#EBC06A" stroke="#D8A665" stroke-width="1.5"/>
    <circle cx="14" cy="-16" r="4" fill="#C9603E" opacity="0.6"/>
    <!-- block 3 (sage, right) -->
    <rect x="34" y="2" width="26" height="26" fill="#8FA37E" stroke="#5F6F5B" stroke-width="1.5"/>
    <path d="M47 10 L52 18 L42 18 Z" fill="#DFE7D4"/>
    <!-- block 4 (clay, far right) -->
    <rect x="66" y="4" width="24" height="24" fill="#C9603E" stroke="#8E3F22" stroke-width="1.5"/>
    <circle cx="78" cy="16" r="5" fill="#F4DDCF"/>
  </g>

  <!-- small ball -->
  <circle cx="440" cy="335" r="14" fill="#7FA3BA" stroke="#5D7A8E" stroke-width="1.5"/>
  <path d="M428 330 Q440 335 452 330" stroke="#FCF8EF" stroke-width="1.5" fill="none"/>

  <!-- floor cushion (right, warm) -->
  <g transform="translate(470,270)">
    <ellipse cx="40" cy="50" rx="55" ry="12" fill="#8E3F22" opacity="0.15"/>
    <path d="M0 20 Q0 10 10 10 L70 10 Q80 10 80 20 L80 50 Q80 60 70 60 L10 60 Q0 60 0 50 Z" fill="#C9603E" opacity="0.75"/>
    <path d="M8 25 Q8 18 15 18 L65 18 Q72 18 72 25 L72 46 Q72 52 65 52 L15 52 Q8 52 8 46 Z" fill="#F4B787" opacity="0.6"/>
  </g>

  <!-- warm light from lamp above -->
  <g transform="translate(515,80)">
    <rect x="-3" y="0" width="6" height="60" fill="#8E3F22" opacity="0.6"/>
    <path d="M-25 60 L25 60 L18 90 L-18 90 Z" fill="#EBC06A"/>
    <ellipse cx="0" cy="92" rx="20" ry="4" fill="#EBC06A" opacity="0.4"/>
  </g>

  <!-- floating dust mote accents -->
  <g fill="#EBC06A" opacity="0.55">
    <circle cx="420" cy="140" r="2"/>
    <circle cx="450" cy="180" r="1.5"/>
    <circle cx="480" cy="140" r="1.8"/>
    <circle cx="400" cy="200" r="1.5"/>
  </g>
</svg>
