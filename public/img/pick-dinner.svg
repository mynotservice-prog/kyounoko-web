<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="温かいお茶碗とおかず">
  <defs>
    <linearGradient id="tableBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DDCF"/>
      <stop offset="1" stop-color="#E2B89C"/>
    </linearGradient>
    <radialGradient id="bowlShadow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8E3F22" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8E3F22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wooden table bg -->
  <rect width="400" height="280" fill="url(#tableBg)"/>
  <!-- wood grain -->
  <g stroke="#8E3F22" stroke-width="0.5" opacity="0.15" fill="none">
    <path d="M0 80 Q100 75 200 85 T400 80"/>
    <path d="M0 150 Q120 145 240 155 T400 150"/>
    <path d="M0 220 Q100 215 200 225 T400 220"/>
  </g>

  <!-- placemat -->
  <rect x="70" y="60" width="260" height="170" fill="#F4DDCF" opacity="0.7" rx="4"/>
  <rect x="70" y="60" width="260" height="170" fill="none" stroke="#C9603E" stroke-width="1" opacity="0.3" rx="4"/>

  <!-- main bowl shadow -->
  <ellipse cx="195" cy="175" rx="90" ry="35" fill="url(#bowlShadow)"/>

  <!-- main bowl -->
  <g transform="translate(195,145)">
    <!-- outer rim -->
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#8E3F22"/>
    <!-- inside dark -->
    <ellipse cx="0" cy="2" rx="75" ry="19" fill="#5F2A17"/>
    <!-- rice -->
    <ellipse cx="0" cy="-2" rx="68" ry="15" fill="#FCF8EF"/>
    <ellipse cx="-15" cy="-4" rx="22" ry="6" fill="#F4DDCF"/>
    <ellipse cx="25" cy="-3" rx="18" ry="5" fill="#F4DDCF"/>
    <!-- rice grain texture -->
    <circle cx="-30" cy="-3" r="1" fill="#EBC06A" opacity="0.5"/>
    <circle cx="20" cy="-5" r="1" fill="#EBC06A" opacity="0.5"/>
    <circle cx="0" cy="-7" r="1" fill="#EBC06A" opacity="0.5"/>
    <circle cx="35" cy="-1" r="1" fill="#EBC06A" opacity="0.5"/>
    <!-- toppings: egg yolk -->
    <ellipse cx="-5" cy="-5" rx="12" ry="8" fill="#EBC06A"/>
    <ellipse cx="-5" cy="-7" rx="10" ry="6" fill="#F4B787" opacity="0.8"/>
    <!-- nori strips -->
    <path d="M-35 -4 L-25 -6 L-22 -2 L-32 0 Z" fill="#25201B" opacity="0.7"/>
    <path d="M18 -6 L28 -8 L30 -4 L20 -2 Z" fill="#25201B" opacity="0.7"/>
    <!-- green onion sprinkle -->
    <circle cx="-40" cy="-6" r="1.5" fill="#8FA37E"/>
    <circle cx="40" cy="-5" r="1.5" fill="#8FA37E"/>
    <circle cx="10" cy="-10" r="1.5" fill="#8FA37E"/>
  </g>

  <!-- steam curves above main bowl -->
  <g stroke="#CFBC9C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M170 100 Q170 80 160 70"/>
    <path d="M195 92 Q195 72 185 62"/>
    <path d="M220 100 Q220 80 210 70"/>
  </g>

  <!-- chopsticks -->
  <g transform="translate(265,130) rotate(25)">
    <rect x="0" y="0" width="80" height="3" fill="#8E3F22" rx="1"/>
    <rect x="0" y="7" width="80" height="3" fill="#8E3F22" rx="1"/>
    <!-- tips darker -->
    <rect x="73" y="0" width="7" height="3" fill="#5F2A17"/>
    <rect x="73" y="7" width="7" height="3" fill="#5F2A17"/>
  </g>

  <!-- side dish (small bowl) -->
  <g transform="translate(100,200)">
    <ellipse cx="0" cy="8" rx="32" ry="4" fill="url(#bowlShadow)"/>
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#C9603E"/>
    <ellipse cx="0" cy="1" rx="26" ry="7" fill="#DFE7D4"/>
    <!-- veggies -->
    <circle cx="-8" cy="-1" r="3" fill="#8FA37E"/>
    <circle cx="5" cy="-2" r="3" fill="#8FA37E"/>
    <circle cx="12" cy="2" r="2.5" fill="#D8A665"/>
    <circle cx="-14" cy="2" r="2.5" fill="#D8A665"/>
  </g>

  <!-- tea cup (upper left) -->
  <g transform="translate(110,100)">
    <ellipse cx="0" cy="20" rx="22" ry="4" fill="url(#bowlShadow)"/>
    <!-- cup -->
    <path d="M-18 0 L-18 18 Q-18 22 -14 22 L14 22 Q18 22 18 18 L18 0 Z" fill="#FCF8EF" stroke="#C9603E" stroke-width="1.5"/>
    <!-- handle -->
    <path d="M18 6 Q28 6 28 12 Q28 18 18 18" fill="none" stroke="#C9603E" stroke-width="1.5"/>
    <!-- tea -->
    <ellipse cx="0" cy="2" rx="15" ry="3" fill="#8E3F22" opacity="0.7"/>
    <!-- steam -->
    <path d="M-5 -10 Q-5 -20 -10 -25" stroke="#CFBC9C" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M5 -12 Q5 -22 0 -27" stroke="#CFBC9C" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- small accent (sauce dish) upper right -->
  <g transform="translate(295,90)">
    <ellipse cx="0" cy="5" rx="18" ry="3" fill="url(#bowlShadow)"/>
    <ellipse cx="0" cy="0" rx="17" ry="6" fill="#F4DDCF" stroke="#C9603E" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="#8E3F22" opacity="0.6"/>
  </g>

  <!-- subtle warm highlight -->
  <ellipse cx="140" cy="80" rx="60" ry="30" fill="#EBC06A" opacity="0.1"/>
</svg>
