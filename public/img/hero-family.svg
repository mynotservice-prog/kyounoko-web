<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="夕暮れの家と家族のシルエット">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DDCF"/>
      <stop offset="0.45" stop-color="#F8ECCB"/>
      <stop offset="0.85" stop-color="#F4B787"/>
      <stop offset="1" stop-color="#EBC06A"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EBC06A" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F4B787" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F4B787" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DDCF"/>
      <stop offset="1" stop-color="#E2B89C"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="600" height="500" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="430" cy="310" r="230" fill="url(#sunGlow)"/>

  <!-- sun -->
  <circle cx="430" cy="310" r="62" fill="#EBC06A" opacity="0.85"/>
  <circle cx="430" cy="310" r="62" fill="none" stroke="#D8A665" stroke-width="1.5" opacity="0.6"/>

  <!-- distant mountains (far) -->
  <path d="M0 335 Q60 310 120 325 Q180 305 250 320 Q320 295 380 310 Q440 288 510 305 Q560 295 600 302 L600 500 L0 500 Z" fill="#8FA37E" opacity="0.35"/>

  <!-- mid hills -->
  <path d="M0 380 Q80 360 160 370 Q240 345 320 360 Q400 340 480 355 Q540 345 600 355 L600 500 L0 500 Z" fill="#728670" opacity="0.5"/>

  <!-- trees -->
  <g opacity="0.75">
    <ellipse cx="60" cy="380" rx="22" ry="36" fill="#5F6F5B"/>
    <ellipse cx="95" cy="390" rx="18" ry="30" fill="#5F6F5B"/>
    <ellipse cx="540" cy="375" rx="24" ry="38" fill="#5F6F5B"/>
    <ellipse cx="570" cy="385" rx="20" ry="32" fill="#5F6F5B"/>
    <ellipse cx="30" cy="395" rx="16" ry="26" fill="#5F6F5B"/>
  </g>

  <!-- ground -->
  <rect x="0" y="405" width="600" height="95" fill="url(#ground)"/>

  <!-- path -->
  <path d="M290 500 Q295 460 310 430 Q325 410 330 400" stroke="#CFBC9C" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- house -->
  <g transform="translate(230,330)">
    <!-- chimney -->
    <rect x="90" y="-18" width="14" height="28" fill="#8E3F22"/>
    <!-- roof -->
    <path d="M-8 28 L70 -14 L148 28 L148 34 L-8 34 Z" fill="#C9603E"/>
    <!-- roof shadow -->
    <path d="M-8 28 L70 -14 L148 28 L140 32 L70 -6 L0 32 Z" fill="#8E3F22" opacity="0.25"/>
    <!-- body -->
    <rect x="0" y="28" width="140" height="72" fill="#FCF8EF"/>
    <!-- body shadow -->
    <rect x="0" y="28" width="140" height="72" fill="#F4DDCF" opacity="0"/>
    <!-- door -->
    <rect x="60" y="62" width="20" height="38" fill="#8E3F22"/>
    <circle cx="76" cy="82" r="1" fill="#EBC06A"/>
    <!-- windows (glowing warm) -->
    <rect x="16" y="46" width="26" height="20" fill="#EBC06A" opacity="0.95"/>
    <rect x="16" y="46" width="26" height="20" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="29" y1="46" x2="29" y2="66" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="16" y1="56" x2="42" y2="56" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <rect x="98" y="46" width="26" height="20" fill="#EBC06A" opacity="0.95"/>
    <rect x="98" y="46" width="26" height="20" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="111" y1="46" x2="111" y2="66" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="98" y1="56" x2="124" y2="56" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <!-- smoke from chimney -->
    <path d="M97 -22 Q103 -32 93 -40 Q87 -48 97 -56 Q105 -64 92 -72" stroke="#FCF8EF" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- figures (parent + child walking toward home) -->
  <g transform="translate(130,430)" fill="#25201B">
    <!-- parent -->
    <circle cx="22" cy="5" r="10"/>
    <path d="M12 15 L12 58 L17 58 L20 38 L24 58 L32 58 L32 15 L22 19 Z" opacity="0.9"/>
    <!-- parent arm extended -->
    <path d="M30 28 Q38 32 46 36" stroke="#25201B" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- child -->
    <circle cx="52" cy="28" r="7"/>
    <path d="M46 35 L46 62 L50 62 L51 50 L53 62 L58 62 L58 35 Z" opacity="0.9"/>
    <!-- child arm extended toward parent -->
    <path d="M46 38 Q42 36 40 35" stroke="#25201B" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- foreground grass tufts -->
  <g stroke="#5F6F5B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M40 470 Q44 460 48 470"/>
    <path d="M80 475 Q84 466 88 475"/>
    <path d="M460 470 Q464 460 468 470"/>
    <path d="M510 475 Q514 466 518 475"/>
    <path d="M550 472 Q554 462 558 472"/>
  </g>

  <!-- subtle foreground flower dots (warm accents) -->
  <circle cx="42" cy="468" r="2" fill="#C9603E" opacity="0.8"/>
  <circle cx="510" cy="470" r="2" fill="#EBC06A" opacity="0.9"/>
  <circle cx="100" cy="485" r="1.8" fill="#C9603E" opacity="0.7"/>
</svg>
