<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="雨の日でも行ける屋内施設の建物">
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA3BA"/>
      <stop offset="0.6" stop-color="#D5E2EB"/>
      <stop offset="1" stop-color="#F4DDCF"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="400" height="280" fill="url(#duskSky)"/>

  <!-- rain drops falling -->
  <g stroke="#7FA3BA" stroke-width="1.3" stroke-linecap="round" opacity="0.55">
    <line x1="30" y1="30" x2="26" y2="45"/>
    <line x1="70" y1="20" x2="66" y2="35"/>
    <line x1="120" y1="15" x2="116" y2="30"/>
    <line x1="180" y1="10" x2="176" y2="25"/>
    <line x1="240" y1="20" x2="236" y2="35"/>
    <line x1="300" y1="15" x2="296" y2="30"/>
    <line x1="360" y1="25" x2="356" y2="40"/>
    <line x1="50" y1="70" x2="46" y2="85"/>
    <line x1="150" y1="60" x2="146" y2="75"/>
    <line x1="270" y1="65" x2="266" y2="80"/>
    <line x1="340" y1="75" x2="336" y2="90"/>
  </g>

  <!-- distant smaller buildings (background) -->
  <rect x="0" y="140" width="40" height="140" fill="#8FA37E" opacity="0.4"/>
  <rect x="340" y="130" width="60" height="150" fill="#8FA37E" opacity="0.4"/>
  <!-- small windows on dist buildings -->
  <rect x="8" y="155" width="4" height="6" fill="#EBC06A" opacity="0.55"/>
  <rect x="20" y="175" width="4" height="6" fill="#EBC06A" opacity="0.55"/>
  <rect x="8" y="195" width="4" height="6" fill="#EBC06A" opacity="0.55"/>
  <rect x="355" y="150" width="4" height="5" fill="#EBC06A" opacity="0.55"/>
  <rect x="375" y="160" width="4" height="5" fill="#EBC06A" opacity="0.55"/>
  <rect x="355" y="180" width="4" height="5" fill="#EBC06A" opacity="0.55"/>

  <!-- main museum/building -->
  <g transform="translate(50,80)">
    <!-- column style base -->
    <rect x="0" y="0" width="300" height="190" fill="#FCF8EF" stroke="#C9603E" stroke-width="2"/>
    <!-- roof -->
    <path d="M-10 0 L150 -25 L310 0 L-10 0 Z" fill="#C9603E"/>
    <!-- entrance -->
    <rect x="130" y="130" width="40" height="60" fill="#8E3F22"/>
    <circle cx="158" cy="160" r="1.5" fill="#EBC06A"/>
    <!-- pillars -->
    <rect x="20" y="20" width="10" height="170" fill="#F4DDCF"/>
    <rect x="80" y="20" width="10" height="170" fill="#F4DDCF"/>
    <rect x="210" y="20" width="10" height="170" fill="#F4DDCF"/>
    <rect x="270" y="20" width="10" height="170" fill="#F4DDCF"/>
    <!-- warm glowing windows, bigger -->
    <rect x="40" y="40" width="36" height="50" fill="#EBC06A" opacity="0.95"/>
    <rect x="40" y="40" width="36" height="50" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="58" y1="40" x2="58" y2="90" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="40" y1="65" x2="76" y2="65" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <rect x="100" y="40" width="36" height="50" fill="#EBC06A" opacity="0.95"/>
    <rect x="100" y="40" width="36" height="50" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="118" y1="40" x2="118" y2="90" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="100" y1="65" x2="136" y2="65" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <rect x="165" y="40" width="36" height="50" fill="#EBC06A" opacity="0.95"/>
    <rect x="165" y="40" width="36" height="50" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="183" y1="40" x2="183" y2="90" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="165" y1="65" x2="201" y2="65" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <rect x="230" y="40" width="36" height="50" fill="#EBC06A" opacity="0.95"/>
    <rect x="230" y="40" width="36" height="50" fill="none" stroke="#D8A665" stroke-width="1"/>
    <line x1="248" y1="40" x2="248" y2="90" stroke="#D8A665" stroke-width="1" opacity="0.7"/>
    <line x1="230" y1="65" x2="266" y2="65" stroke="#D8A665" stroke-width="1" opacity="0.7"/>

    <!-- sign -->
    <rect x="115" y="105" width="70" height="15" fill="#C9603E" opacity="0.8"/>
  </g>

  <!-- family figures walking toward entrance -->
  <g transform="translate(185,220)" fill="#25201B">
    <!-- adult -->
    <circle cx="5" cy="0" r="6"/>
    <path d="M-1 6 L-1 38 L2 38 L3 24 L5 38 L11 38 L11 6 L5 10 Z" opacity="0.9"/>
    <!-- child -->
    <circle cx="20" cy="18" r="4"/>
    <path d="M17 22 L17 40 L19 40 L20 32 L21 40 L23 40 L23 22 Z" opacity="0.9"/>
    <!-- umbrella -->
    <path d="M-15 -5 Q5 -18 25 -5 Z" fill="#C9603E"/>
    <line x1="5" y1="-5" x2="5" y2="0" stroke="#25201B" stroke-width="1.5"/>
  </g>

  <!-- ground/pavement -->
  <rect y="260" width="400" height="20" fill="#C9603E" opacity="0.12"/>
</svg>
